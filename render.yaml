# Render Blueprint — deploy the API against the existing Neon database.
# Set the Neon and Cloudflare R2 secrets (marked sync:false) in the Render
# dashboard before the first deploy. JWT_SECRET is generated by Render.
services:
  - type: web
    name: healthboard-api
    runtime: docker
    plan: starter            # NOT "free": free disk is ephemeral and the service sleeps
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      # Existing Neon database containing the production candidate profiles.
      - key: DATABASE_URL
        sync: false
      # Auth — Render generates a strong secret.
      - key: JWT_SECRET
        generateValue: true
      # CORS — set to your real frontend origin(s) in the dashboard. Never "*"
      # in production: with credentials that would expose the API to any site.
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      # Zoom General OAuth app. The redirect must exactly match
      # https://<halo-domain>/api/integrations/zoom/callback in Zoom Marketplace.
      - key: ZOOM_OAUTH_CLIENT_ID
        sync: false
      - key: ZOOM_OAUTH_CLIENT_SECRET
        sync: false
      - key: ZOOM_OAUTH_REDIRECT_URI
        sync: false
      - key: ZOOM_OAUTH_SCOPES
        value: ""
      # Stable key used to encrypt organization refresh tokens at rest.
      - key: INTEGRATION_ENCRYPTION_KEY
        generateValue: true
      # Object storage (Cloudflare R2) — set these in the dashboard.
      - key: STORAGE_ENABLED
        value: "true"
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: S3_ACL
        value: ""
      # Email (SendGrid) — optional; set in dashboard to enable.
      - key: EMAIL_ENABLED
        value: "false"
      - key: SENDGRID_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # First admin (created on startup).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Error monitoring (Sentry) — optional; set the DSN in the dashboard to
      # turn it on. Left unset, no error data leaves the service.
      - key: SENTRY_DSN
        sync: false

  - type: cron
    name: healthboard-contact-backfill
    runtime: docker
    schedule: "*/10 * * * *"
    dockerCommand: python -m app.contact_backfill
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MEDHUNT_API_BASE_URL
        sync: false
      - key: MEDHUNT_SERVICE_TOKEN
        sync: false
      - key: CONTACT_BACKFILL_BATCH_SIZE
        value: "100"
      - key: CONTACT_BACKFILL_NOT_FOUND_COOLDOWN_DAYS
        value: "30"
