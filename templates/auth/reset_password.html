<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset your password · HealthBoard</title>
  <meta name="robots" content="noindex">
  <style>
    :root{--ink:#0f2f66;--ink-strong:#082452;--muted:#405f8d;--faint:#6682aa;
      --line:#dce7f7;--line-2:#b9ccec;--soft:#f2f7ff;--accent:#075fe8;--accent-strong:#0049bd;
      --rose:#e11d48;--ok:#047857}
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:linear-gradient(160deg,#eef4ff,#f8fbff);color:var(--ink);
      min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
    .card{background:#fff;border:1px solid var(--line);border-radius:16px;width:min(420px,100%);
      padding:30px 30px 26px;box-shadow:0 20px 40px -18px rgba(13,37,69,.28)}
    .brand{font-size:19px;font-weight:700;color:var(--accent);margin-bottom:20px}
    h1{font-size:20px;margin:0 0 6px;color:var(--ink-strong)}
    p.sub{font-size:13.5px;color:var(--faint);margin:0 0 20px;line-height:1.55}
    label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 6px}
    .pw-wrap{position:relative;margin-bottom:14px}
    input{width:100%;padding:11px 40px 11px 13px;border:1px solid var(--line-2);border-radius:9px;
      font-size:14px;color:var(--ink);background:#fff}
    input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(7,95,232,.14)}
    .toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;
      color:var(--faint);cursor:pointer;font-size:12px;padding:6px}
    .btn{width:100%;padding:12px;border:0;border-radius:9px;background:var(--accent);color:#fff;
      font-size:14.5px;font-weight:600;cursor:pointer;transition:background .12s}
    .btn:hover{background:var(--accent-strong)}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    .hint{font-size:12px;color:var(--faint);margin:2px 0 16px}
    .msg{font-size:13px;border-radius:9px;padding:11px 13px;margin-bottom:16px;display:none;line-height:1.5}
    .msg.err{display:block;background:#fff1f4;border:1px solid #fecdd3;color:var(--rose)}
    .msg.ok{display:block;background:#ecfdf5;border:1px solid #a7f3d0;color:var(--ok)}
    .foot{text-align:center;margin-top:18px;font-size:13px}
    a{color:var(--accent);text-decoration:none;font-weight:600}
    a:hover{text-decoration:underline}
    .done{text-align:center}
    .done .tick{font-size:34px;color:var(--ok);margin-bottom:8px}
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">HealthBoard</div>
    <div id="view-form">
      <h1>Choose a new password</h1>
      <p class="sub">Enter a new password for your account. This link works once and expires an hour after it was sent.</p>
      <div id="msg" class="msg"></div>
      <form id="form">
        <label for="pw">New password</label>
        <div class="pw-wrap">
          <input id="pw" type="password" autocomplete="new-password" placeholder="At least 8 characters">
          <button type="button" class="toggle" id="toggle" aria-label="Show password">Show</button>
        </div>
        <label for="pw2">Confirm password</label>
        <div class="pw-wrap">
          <input id="pw2" type="password" autocomplete="new-password" placeholder="Re-enter your password">
        </div>
        <p class="hint">Use at least 8 characters.</p>
        <button class="btn" id="submit" type="submit">Reset password</button>
      </form>
    </div>
    <div id="view-done" class="done" style="display:none">
      <div class="tick">&#10004;</div>
      <h1>Password reset</h1>
      <p class="sub">Your password has been changed. You can sign in with it now.</p>
      <a class="btn" href="/" style="display:inline-block;text-decoration:none;text-align:center">Go to sign in</a>
    </div>
  </div>
  <script>
    (function(){
      var token = new URLSearchParams(location.search).get("token");
      var msg = document.getElementById("msg");
      function showErr(t){ msg.className = "msg err"; msg.textContent = t; }
      if (!token){
        showErr("This link is missing its reset token. Request a new reset email from the sign-in page.");
        document.getElementById("form").style.display = "none";
      }
      var pw = document.getElementById("pw"), tog = document.getElementById("toggle");
      tog.onclick = function(){
        var show = pw.type === "password";
        pw.type = show ? "text" : "password";
        tog.textContent = show ? "Hide" : "Show";
      };
      document.getElementById("form").addEventListener("submit", async function(e){
        e.preventDefault();
        msg.className = "msg"; msg.textContent = "";
        var p1 = pw.value, p2 = document.getElementById("pw2").value;
        if (p1.length < 8) return showErr("Password must be at least 8 characters.");
        if (p1 !== p2) return showErr("The two passwords do not match.");
        var btn = document.getElementById("submit");
        btn.disabled = true; btn.textContent = "Resetting…";
        try {
          var res = await fetch("/api/auth/password-reset/confirm", {
            method:"POST", headers:{"Content-Type":"application/json"},
            body: JSON.stringify({token: token, new_password: p1})
          });
          if (!res.ok){
            var data = null; try { data = await res.json(); } catch(_){}
            var detail = data && data.detail ? data.detail : "That did not work.";
            btn.disabled = false; btn.textContent = "Reset password";
            return showErr(res.status === 400
              ? "This reset link is invalid or has expired. Request a new one from the sign-in page."
              : (typeof detail === "string" ? detail : "That did not work."));
          }
          document.getElementById("view-form").style.display = "none";
          document.getElementById("view-done").style.display = "block";
        } catch(err){
          btn.disabled = false; btn.textContent = "Reset password";
          showErr("Could not reach the server. Try again in a moment.");
        }
      });
    })();
  </script>
</body>
</html>
