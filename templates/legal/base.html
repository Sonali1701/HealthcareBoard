<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% endblock %} · HealthBoard</title>
  <style>
    :root{--ink:#0f2f66;--ink-strong:#082452;--muted:#405f8d;--faint:#6682aa;
      --line:#dce7f7;--line-2:#b9ccec;--soft:#f2f7ff;--accent:#075fe8;--accent-strong:#0049bd;--amber:#92400e}
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:#f8fbff;color:var(--ink);line-height:1.65}
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}
    header.top{position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
      border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;
      justify-content:space-between;z-index:5}
    header.top .brand{font-size:18px;font-weight:700;color:var(--accent)}
    header.top a.back{font-size:13.5px;font-weight:600}
    main.doc{max-width:780px;margin:0 auto;padding:30px 22px 70px}
    h1{font-size:30px;margin:6px 0 4px;color:var(--ink-strong);letter-spacing:-.02em}
    .updated{font-size:13px;color:var(--faint);margin:0 0 22px}
    .review{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:14px 16px;
      margin:0 0 26px;font-size:13px;color:var(--amber);line-height:1.6}
    .review strong{color:#78350f}
    .toc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin:0 0 30px}
    .toc h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);margin:0 0 10px;border:0;padding:0}
    .toc ol{margin:0;padding-left:20px;columns:2;column-gap:26px;font-size:13.5px}
    .toc li{margin:0 0 6px;break-inside:avoid}
    h2{font-size:19px;margin:34px 0 10px;color:var(--ink-strong);padding-top:8px;
      border-top:1px solid var(--line)}
    h2:first-of-type{border-top:0}
    h3{font-size:15px;margin:20px 0 6px;color:var(--ink-strong)}
    p,li{font-size:14.5px;color:#294c7d}
    ul,ol.body{padding-left:22px}
    li{margin:0 0 7px}
    .fill{background:var(--soft);border:1px dashed var(--line-2);border-radius:5px;padding:1px 6px;
      font-weight:600;color:var(--accent-strong);font-size:13.5px}
    .callout{background:var(--soft);border:1px solid var(--line);border-left:3px solid var(--accent);
      border-radius:8px;padding:12px 16px;margin:14px 0;font-size:13.5px}
    footer.foot{border-top:1px solid var(--line);padding:22px;text-align:center;font-size:13px;color:var(--faint)}
    footer.foot a{margin:0 8px}
    @media(max-width:620px){.toc ol{columns:1}h1{font-size:25px}}
  </style>
</head>
<body>
  <header class="top">
    <span class="brand">HealthBoard</span>
    <a class="back" href="/">&larr; Back to HealthBoard</a>
  </header>
  <main class="doc">
    {% block body %}{% endblock %}
  </main>
  <footer class="foot">
    <div>&copy; <span class="fill">[Year]</span> <span class="fill">[Company Legal Name]</span>. All rights reserved.</div>
    <div style="margin-top:8px"><a href="/terms">Terms of Service</a> · <a href="/privacy">Privacy Policy</a> · <a href="/">Home</a></div>
  </footer>
</body>
</html>
